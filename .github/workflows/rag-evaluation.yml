name: RAG Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: rag-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest rag.test_rag_eval_runner ingest.test_ingest -v

  rag-quality-gate:
    name: RAG Quality Gate
    if: github.event_name != 'push'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: qa-learning-ci
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      GROQ_JUDGE_MODEL: ${{ vars.GROQ_JUDGE_MODEL || vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          import sys
          missing = [name for name in ("GROQ_API_KEY", "LANGSMITH_API_KEY") if not os.getenv(name)]
          if missing:
              print("Missing GitHub Actions secrets: " + ", ".join(missing))
              print("Fork PRs cannot access repository secrets. Evaluate reviewed code on a trusted branch.")
              sys.exit(1)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Evaluate the full golden dataset
        shell: bash
        run: python -u -m rag.rag_eval_runner 2>&1 | tee rag-evaluation.log
      - name: Upload evaluation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-log-${{ github.run_id }}
          path: rag-evaluation.log
          if-no-files-found: ignore
          retention-days: 14